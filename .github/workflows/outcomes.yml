name: Update Outcomes
on:
  workflow_dispatch:
  repository_dispatch:
    types: [update_outcomes]
  # schedule:
  # - cron: "*/15 * * * *" # cada 15 min — OPCIONAL: descomentá si querés que GitHub lo
  #   dispare nativo en vez de cron-job.org (no uses los dos a la vez = doble run).

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install requests pandas==2.2.3
      - name: Run update_outcomes
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: "utf-8"
        run: python -u update_outcomes.py
