name: IV diaria (opciones)

# JUNTA LA VOLATILIDAD IMPLICITA TODOS LOS DIAS, Y ESO ES TODO LO QUE HACE.
#
# La corrida 8 (`banco/PREREGISTRO_OPCIONES.md`) cerro la direccion de vender
# volatilidad en alts por POTENCIA, no por el efecto: el instrumento existe y cruzar
# cuesta 1-2% de la prima, pero en agosto de 2026 solo habia 18 meses de implicita
# para SOL y 10 para XRP. Con n = 18 meses el MDE da 39%/anio contra un umbral
# preregistrado de 10%, y BTC —cuyo efecto esta medido y es conocido— da 27,1% con
# esa misma ventana.
#
# Lo unico que reabre esa direccion es HISTORIA, y la historia solo se puede EMPEZAR
# a juntar: los venues sirven una ventana limitada y lo que no se guardo hoy no esta
# manana. Por eso esto es un cron y no un script que se corre cuando hace falta. El
# costo de no tenerlo es que dentro de un anio se este igual que hoy.
#
# Solo se guarda la implicita, a proposito: la realizada sale de klines de Binance,
# que estan completos hacia atras y se pueden bajar cualquier dia.
#
# Son ~200 bytes por dia. No necesita secrets: es data publica de Bybit y Deribit.

on:
  workflow_dispatch:
  schedule:
    # 01:20 UTC: el DVOL de Deribit cierra su vela diaria a las 00:00, asi que a esta
    # hora el dia anterior ya esta completo. El colector pide 7 dias hacia atras en
    # cada corrida, asi que un par de dias salteados se recuperan solos.
    - cron: "20 1 * * *"

permissions:
  contents: write

jobs:
  juntar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests "pandas==2.2.3"

      - name: Juntar la implicita del dia
        working-directory: opciones
        # El script sale con codigo 1 solo si NINGUNA de las dos fuentes devuelve datos.
        # Eso es a proposito: la forma en que esto se muere en silencio es que el endpoint
        # cambie, el workflow quede en verde durante meses y el dato no se guarde.
        # Si una sola fuente falla, guarda lo que hay y emite un ::warning::.
        run: python juntar_iv.py --dias 7

      - name: Juntar el skew del dia
        working-directory: opciones
        # `always()` porque el skew no depende de la implicita y es el dato MAS
        # perecedero de los dos: la cadena vencida no se puede recuperar de ningun
        # venue, mientras que la implicita tiene ~25 dias de ventana. Acoplarlo al paso
        # anterior costo 11 dias de skew que no vuelven (2026-09-20 -> 09-30).
        if: always()
        # El NIVEL de implicita (lo de arriba) y su INCLINACION son dos cosas
        # distintas: la corrida 8 midio el nivel, y el skew no esta en ninguna parte
        # del repo. Va en el mismo cron porque es la misma cadencia y el mismo dato
        # perecedero — la cadena vencida no se puede recuperar de ningun venue.
        run: python juntar_skew.py

      - name: Commitear lo nuevo
        # `always()` porque commitear NO es parte de juntar. Del 2026-09-20 al 09-30 este
        # paso no corrio once veces seguidas —Bybit daba 403 y el colector salia 1— y con
        # el se fueron las 16 filas diarias de DVOL que Deribit si estaba devolviendo.
        # El dato que ya esta en el disco se guarda, y el run igual queda rojo si el
        # colector fallo de verdad: el estado del job no lo decide este paso.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opciones/iv_diaria opciones/skew_diario
          if git diff --cached --quiet; then
            echo "sin filas nuevas (el venue todavia no publico el dia): nada que commitear"
          else
            git commit -m "iv: implicita y skew del $(date -u +%Y-%m-%d)"
            # `prima_radar.yml` empuja cada 2h contra el mismo repo: si entro en el
            # medio, rebasear y reintentar. Los CSV son append idempotente.
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
              sleep 5
            done
            echo "no se pudo pushear despues de 3 intentos" >&2
            exit 1
          fi
