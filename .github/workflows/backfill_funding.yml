name: Swing Backfill Funding (vision)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-swing-funding]
  # Funding desde data.binance.vision (dumps mensuales, sin geo-block) → corre en GitHub-hosted.
  # Diario: solo llena alertas de meses YA cerrados (idempotente, funding_rate=null). El lag
  # mensual es inherente a la fuente; válido para el forward-test retrospectivo del gate de funding.
  schedule:
    - cron: "0 6 * * *"
jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install requests
      - name: Run backfill funding
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: "utf-8"
        run: python -u swing/backfill_funding.py
