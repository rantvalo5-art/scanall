name: Radar (magnitud)

# SE INTENTA CADA 2 HORAS PARA CONSEGUIR UNA BARRA CADA 4. No es lo mismo.
#
# El horizonte se midio, no se eligio. `banco/horizonte_util.py` lo barrio con metricas
# SIN ESCALA (las unicas comparables entre horizontes) y la senal es MONOTONA: mas fuerte
# cuanto mas corto.
#
#   horizonte    multiplo   tasa    t
#        4h        1,21x   62,6%  22,6     <- gana en las tres
#       24h        1,15x   61,3%  15,5
#      168h        1,11x   59,6%   7,0
#
# Es agrupamiento de volatilidad: la informacion de un pico de actividad dura horas, no
# dias. La primera version corria una vez por dia porque el banco habia fijado 24h al
# principio y nunca se cuestiono.
#
# LO QUE TIENE QUE VALER PASO = HORIZONTE ES LA MEDICION, NO EL CRON. Si dos corridas
# estan a menos de 4h comparten futuro, y contarlas como dos observaciones infla el n
# aparente — el defecto que el resto del repo arrastra por contar entradas solapadas como
# si fueran independientes. Eso ya lo garantiza `medir.py`, que de-solapa: camina hacia
# adelante y se queda con la primera de cada grupo de menos de 4h.
#
# La version anterior pedia 6 corridas por dia a :10 y confiaba en que llegaran
# espaciadas. No llegan. Medido sobre los primeros 7,5 dias en vivo (29 corridas,
# 28-ago -> 4-sep):
#
#   entrega de GitHub          65% de las pedidas (saltea 2 de cada 6)
#   atraso contra el slot :10  mediana 2,15h, p90 3,19h, maximo 3,95h
#
# Con un atraso mediano de DOS HORAS sobre un espaciado nominal de cuatro, todos los dias
# un par terminaba a ~3h20m y el de-solape lo descartaba, correctamente. Neto: 23 barras
# utiles de 45 pedidas, 51%. Pedir MENOS seguido (cada 6h) empeora esto —serian ~2,6
# corridas/dia y el atraso de hasta 4h seguiria produciendo pares sub-4h—; pedir mas
# seguido lo arregla, porque el de-solape elige el subconjunto limpio.
#
# Elegir por hora de reloj no depende del resultado de ninguna corrida, asi que densificar
# el muestreo no mete sesgo: solo tapa los huecos que deja el scheduler.
on:
  workflow_dispatch:
  schedule:
    # PRINCIPALES: guardan el universo Y mandan el top-8 al celular.
    - cron: "10 0,4,8,12,16,20 * * *"
    # DE RELLENO, a mitad de camino: guardan y NO avisan, para no multiplicar las
    # notificaciones. Solo existen para que, cuando GitHub saltee o atrase una principal,
    # haya igual una corrida cerca de la marca de 4h que el de-solape pueda tomar.
    - cron: "10 2,6,10,14,18,22 * * *"

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests "pandas==2.2.3" numpy

      - name: Correr radar y guardar el universo
        working-directory: radar
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.DAY_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DAY_TELEGRAM_CHAT_ID }}
          # Vacio en las corridas de relleno: guardan igual, pero sin avisar.
          TELEGRAM_FLAG: "${{ (github.event_name != 'schedule' || github.event.schedule == '10 0,4,8,12,16,20 * * *') && '--telegram' || '' }}"
        # --supabase guarda el universo entero (lo que habilita medirlo despues) y va
        # SIEMPRE: las de relleno valen tanto como las principales para la medicion.
        # --telegram solo en las principales y a mano. Sacá el flag si no lo querés en
        # el celular; sacarlo no afecta el forward test.
        run: |
          python radar.py --k 8 --supabase ${TELEGRAM_FLAG}

