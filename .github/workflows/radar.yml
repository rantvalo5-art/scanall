name: Radar (magnitud)

# CADA 4 HORAS, y el numero se midio, no se eligio.
#
# `banco/horizonte_util.py` barrio el horizonte con metricas SIN ESCALA (las unicas
# comparables entre horizontes) y la senal es MONOTONA: mas fuerte cuanto mas corto.
#
#   horizonte    multiplo   tasa    t
#        4h        1,21x   62,6%  22,6     <- gana en las tres
#       24h        1,15x   61,3%  15,5
#      168h        1,11x   59,6%   7,0
#
# Es agrupamiento de volatilidad: la informacion de un pico de actividad dura horas, no
# dias. La primera version de este workflow corria una vez por dia porque el banco habia
# fijado 24h al principio y nunca se cuestiono.
#
# La cadencia tiene que ser IGUAL al horizonte (paso = horizonte), asi las barras no se
# solapan y el n contado es el n real. Correrlo cada hora con horizonte de 4h daria
# corridas solapadas y el forward test heredaria el defecto que el resto del repo
# arrastra por contar entradas solapadas como si fueran independientes.
#
# Si lo queres mirar mas seguido, corrélo a mano (`py -3.13 -u radar.py`). Eso no
# ensucia nada porque no escribe a Supabase sin `--supabase`.
on:
  workflow_dispatch:
  schedule:
    # :10 de cada 4 horas: la vela de la hora anterior ya cerro. El cron de GitHub
    # puede demorarse 5-15 min en horas pico y no importa para la medicion: lo que
    # tiene que ser estable es el espaciado, no el minuto exacto.
    - cron: "10 0,4,8,12,16,20 * * *"

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests "pandas==2.2.3" numpy

      - name: Correr radar y guardar el universo
        working-directory: radar
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.DAY_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DAY_TELEGRAM_CHAT_ID }}
        # --supabase guarda el universo entero (lo que habilita medirlo despues).
        # --telegram manda el top-8. Sacá el flag si no lo querés en el celular.
        run: python radar.py --k 8 --supabase --telegram
